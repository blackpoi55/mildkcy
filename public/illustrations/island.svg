<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4338ca"/>
      <stop offset="0.38" stop-color="#7c3aed"/>
      <stop offset="0.68" stop-color="#f0abfc"/>
      <stop offset="0.86" stop-color="#fdba74"/>
      <stop offset="1" stop-color="#fde68a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff7cc" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#fde68a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fde68a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffbeb"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.25" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6d28d9"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="jungle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b2a8f"/>
      <stop offset="1" stop-color="#26206b"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fcd9a8"/>
      <stop offset="1" stop-color="#f4b183"/>
    </linearGradient>
  </defs>

  <!-- ท้องฟ้ายามเย็น -->
  <rect width="1200" height="400" fill="url(#sky)"/>
  <circle cx="860" cy="255" r="190" fill="url(#glow)"/>
  <circle cx="860" cy="255" r="62" fill="url(#sun)"/>

  <!-- เมฆ -->
  <g fill="#fff" opacity="0.35">
    <ellipse cx="240" cy="86" rx="90" ry="14"/>
    <ellipse cx="290" cy="74" rx="52" ry="16"/>
    <ellipse cx="660" cy="120" rx="70" ry="10"/>
    <ellipse cx="1040" cy="70" rx="96" ry="13"/>
    <ellipse cx="1000" cy="60" rx="46" ry="14"/>
  </g>

  <!-- นก -->
  <g fill="none" stroke="#312e81" stroke-width="2.4" stroke-linecap="round" opacity="0.7">
    <path d="M560 70 q8 -8 16 0 q8 -8 16 0"/>
    <path d="M600 96 q6 -6 12 0 q6 -6 12 0"/>
    <path d="M520 104 q5 -5 10 0 q5 -5 10 0"/>
  </g>

  <!-- ภูเขาเกาะช้าง (ไกล → ใกล้) -->
  <path d="M0 262 C120 200 210 196 300 228 C380 170 470 150 560 208 C620 186 680 200 740 262 Z" fill="url(#far)" opacity="0.75"/>
  <path d="M-20 280 C80 210 160 190 250 226 C320 160 400 132 480 186 C540 168 600 190 650 230 C700 218 740 240 780 280 Z" fill="url(#mid)"/>
  <path d="M960 284 C1010 240 1060 226 1110 244 C1150 232 1190 240 1220 262 L1220 284 Z" fill="url(#mid)" opacity="0.85"/>

  <!-- ทะเล -->
  <rect y="276" width="1200" height="124" fill="url(#sea)"/>
  <g fill="#fff7cc" opacity="0.75">
    <rect x="800" y="288" width="120" height="3" rx="1.5"/>
    <rect x="818" y="300" width="84" height="3" rx="1.5"/>
    <rect x="830" y="312" width="60" height="3" rx="1.5"/>
    <rect x="842" y="324" width="36" height="3" rx="1.5"/>
    <rect x="850" y="336" width="20" height="2.5" rx="1.25"/>
  </g>
  <g stroke="#fff" stroke-width="2" stroke-linecap="round" opacity="0.28" fill="none">
    <path d="M420 320 h70"/>
    <path d="M560 346 h90"/>
    <path d="M1000 330 h80"/>
    <path d="M700 372 h60"/>
    <path d="M1080 368 h70"/>
  </g>

  <!-- เรือหางยาว -->
  <g transform="translate(600 300)" fill="#1e1b4b">
    <path d="M0 10 C30 18 90 18 120 6 L128 0 L116 14 C90 26 30 26 4 16 Z"/>
    <rect x="44" y="-6" width="34" height="12" rx="3"/>
    <path d="M10 6 L-28 18" stroke="#1e1b4b" stroke-width="2.5"/>
  </g>

  <!-- ป่าบนเกาะฝั่งซ้าย + หาดทราย -->
  <path d="M-20 300 C60 262 150 256 230 282 C280 268 330 274 380 300 C410 316 444 344 476 386 L-20 400 Z" fill="url(#jungle)"/>
  <path d="M-20 360 C80 330 200 326 330 344 C400 352 460 372 500 400 L-20 400 Z" fill="url(#sand)"/>
  <path d="M-20 360 C80 330 200 326 330 344 C400 352 460 372 500 400" fill="none" stroke="#fff" stroke-width="3" opacity="0.5"/>

  <!-- ต้นมะพร้าว -->
  <g fill="#1e1b4b">
    <!-- ต้นใหญ่ -->
    <path d="M168 372 C166 320 176 262 210 196 L218 199 C188 262 180 322 184 372 Z"/>
    <g transform="translate(212 194)">
      <path d="M0 0 C-30 -26 -78 -26 -104 2 C-72 -10 -40 -6 0 6 Z"/>
      <path d="M0 0 C-14 -38 -50 -58 -86 -48 C-52 -40 -28 -22 0 6 Z"/>
      <path d="M0 0 C18 -40 58 -54 92 -38 C56 -34 30 -16 2 6 Z"/>
      <path d="M0 0 C34 -18 78 -12 102 16 C70 6 38 4 2 8 Z"/>
      <path d="M0 0 C22 6 48 32 52 66 C36 40 18 24 -2 8 Z"/>
      <path d="M0 0 C-22 8 -44 36 -44 68 C-30 42 -16 26 2 8 Z"/>
      <circle cx="-4" cy="8" r="6"/><circle cx="7" cy="10" r="5.5"/>
    </g>
    <!-- ต้นเล็ก -->
    <path d="M290 380 C292 340 304 300 330 262 L336 266 C312 302 302 340 302 380 Z"/>
    <g transform="translate(332 260) scale(0.72)">
      <path d="M0 0 C-30 -26 -78 -26 -104 2 C-72 -10 -40 -6 0 6 Z"/>
      <path d="M0 0 C-14 -38 -50 -58 -86 -48 C-52 -40 -28 -22 0 6 Z"/>
      <path d="M0 0 C18 -40 58 -54 92 -38 C56 -34 30 -16 2 6 Z"/>
      <path d="M0 0 C34 -18 78 -12 102 16 C70 6 38 4 2 8 Z"/>
      <path d="M0 0 C22 6 48 32 52 66 C36 40 18 24 -2 8 Z"/>
      <path d="M0 0 C-22 8 -44 36 -44 68 C-30 42 -16 26 2 8 Z"/>
    </g>
    <!-- ต้นขวา -->
    <path d="M1124 400 C1124 350 1110 300 1080 254 L1086 250 C1118 298 1134 350 1138 400 Z"/>
    <g transform="translate(1082 250) scale(0.85)">
      <path d="M0 0 C-30 -26 -78 -26 -104 2 C-72 -10 -40 -6 0 6 Z"/>
      <path d="M0 0 C-14 -38 -50 -58 -86 -48 C-52 -40 -28 -22 0 6 Z"/>
      <path d="M0 0 C18 -40 58 -54 92 -38 C56 -34 30 -16 2 6 Z"/>
      <path d="M0 0 C34 -18 78 -12 102 16 C70 6 38 4 2 8 Z"/>
      <path d="M0 0 C22 6 48 32 52 66 C36 40 18 24 -2 8 Z"/>
      <path d="M0 0 C-22 8 -44 36 -44 68 C-30 42 -16 26 2 8 Z"/>
    </g>
  </g>
</svg>
